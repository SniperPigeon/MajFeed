name: dockerbuild

on: 
    push:
        branches: [main]
        tags: ['v*.*.*']
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    unittest:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                # Install a specific version of uv.
                version: "0.13.0"
                enable-cache: true             #    缓存 uv 下载的包，第二次跑更快
            
            - name: run_unittest
              run: uv run --locked python -m unittest discover -s tests -v
              env:
                PYTHONPATH: src


    docker:
      runs-on: ubuntu-latest
      needs: unittest
      env:
        SHOULD_PUSH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      steps:
        - name: Docker Meta
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: ${{ vars.DOCKER_USERNAME }}/majfeed
            # 每行一条规则，不匹配当前触发方式的规则会被自动忽略：
            #   push main      -> main, sha-xxxxxxx
            #   push v0.1.0    -> 0.1.0, 0.1, latest（latest 由 semver 自动附加）
            #   pull_request   -> pr-1
            tags: |
              type=ref,event=branch
              type=ref,event=pr
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=sha
        -
          name: Login to Docker Hub
          if: env.SHOULD_PUSH == 'true'
          # PR不登陆也不push
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        # -
        #   name: Set up QEMU
        #   uses: docker/setup-qemu-action@v4 Unused as we only work with amd64/linux
        -
          name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4
        -
          name: Build and push
          uses: docker/build-push-action@v7
          with:
            platforms: linux/amd64
            push: ${{ env.SHOULD_PUSH }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
